# ImpactBridge Local Database Services
# NOTE: For local development, the backend uses embedded SQLite (apps/backend/prisma/dev.db).
# Use this docker-compose if you wish to run a local MySQL instance for production-parity testing.
version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: impactbridge_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: impactbridge_db
      MYSQL_USER: impactbridge
      MYSQL_PASSWORD: Impactbridge@2026!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
